name: Source feed contract check
on:
  workflow_dispatch:
  schedule:
    - cron: '37 10 * * 1'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_feed_health.py' -v
      - run: python feed_health.py --json