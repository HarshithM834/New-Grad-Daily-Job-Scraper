name: Daily new grad SWE, DE and AI/ML jobs

on:
  schedule:
    - cron: '0 13 * * *' # 13:00 UTC; 9am EDT / 8am EST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newgrad-job-tracker
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scrape all three job feeds and resolve employer application URLs
        env:
          MAX_JOBS_PER_SOURCE: '50'
          SCROLL_STEPS: '24'
        run: python scraper.py
      - name: Commit new jobs to tracker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2027 New Grad Positions Tracker - Sheet1.csv' unresolved_jobs.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update SWE, DE and AI/ML new grad tracker'
            git push
          else
            echo 'No changes to tracker'
          fi
